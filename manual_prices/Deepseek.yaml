models:
  Deepseek:
    # 模型定价：https://api-docs.deepseek.com/quick_start/pricing

    # DeepSeek V4.1 Flash (2026-09-10 发布, 原生多模态视觉理解, 全新架构)
    # 1M context, max 384K output, 支持思考/非思考模式
    # 峰谷定价：高峰时段 (UTC 01:00-04:00, 06:00-10:00, 周一至周五) 价格 2x；以下为非高峰价格
    # V4 Flash / V4 Flash Vision Exp 已下线，请求路由至 V4.1 Flash
    deepseek-flash:
      aliases:
        - deepseek-v4-flash
        - deepseek-v4-flash-0731
        - deepseek-v4-flash-vision-exp
      input: 0.15 usd / M
      output: 0.60 usd / M
      extra_ratios:
        - cached_tokens: 0.003 usd / M

    # DeepSeek V4 Pro (2026-09-10 官方更新：应需求继续提供 API 服务，计费方式不变)
    deepseek-v4-pro:
      aliases:
        - deepseek-v4-pro-0813
      input: 0.66 usd / M
      output: 1.98 usd / M
      extra_ratios:
        - cached_tokens: 0.022 usd / M

    # =========================== 已下线 ===========================
    # deepseek-chat 和 deepseek-reasoner 已于 2026-07-24 弃用，分别对应 deepseek-v4-flash 的非思考/思考模式
    deepseek-chat:
      deprecated: 2026-07-24
      aliases:
        - deepseek-v3.2
      input: 1 rmb / M
      output: 2 rmb / M
      extra_ratios:
        - cached_tokens: 0.02 rmb / M
    deepseek-reasoner:
      deprecated: 2026-07-24
      aliases:
        - deepseek-v3.2-thinking
        - deepseek-v3.2-speciale*
      input: 1 rmb / M
      output: 2 rmb / M
      extra_ratios:
        - cached_tokens: 0.02 rmb / M
