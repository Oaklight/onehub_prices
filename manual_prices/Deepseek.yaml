models:
  Deepseek:
    # 模型定价：https://api-docs.deepseek.com/quick_start/pricing

    # DeepSeek V4 系列 (1M context, max 384K output, 支持思考/非思考模式)
    # 峰谷定价自 2026-08-16T16:00Z 生效
    # 高峰时段 (UTC 01:00-04:00, 06:00-10:00) 价格 2x；以下为非高峰价格
    deepseek-v4-flash:
      aliases:
        - deepseek-v4-flash-0731
      input: 0.22 usd / M
      output: 0.66 usd / M
      extra_ratios:
        - cached_tokens: 0.007 usd / M
    deepseek-v4-pro:
      aliases:
        - deepseek-v4-pro-0813
      input: 0.66 usd / M
      output: 1.98 usd / M
      extra_ratios:
        - cached_tokens: 0.022 usd / M

    # =========================== 已下线 ===========================
    # deepseek-chat 和 deepseek-reasoner 已于 2026-07-24 弃用，分别对应 deepseek-v4-flash 的非思考/思考模式
    deepseek-chat:
      deprecated: 2026-07-24
      aliases:
        - deepseek-v3.2
      input: 1 rmb / M
      output: 2 rmb / M
      extra_ratios:
        - cached_tokens: 0.02 rmb / M
    deepseek-reasoner:
      deprecated: 2026-07-24
      aliases:
        - deepseek-v3.2-thinking
        - deepseek-v3.2-speciale*
      input: 1 rmb / M
      output: 2 rmb / M
      extra_ratios:
        - cached_tokens: 0.02 rmb / M
